
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PDFVio: AI PDF Converter & Fast Document Editor</title>
    <meta name="description" content="Aadhaar in One Page and PDF tools suite with multilingual support (English, Marathi, Hindi). Fast merge, convert, scan, and edit documents directly in the browser.">
    <meta name="theme-color" content="#2E5BFF">
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google AdSense Placeholder -->
    <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0000000000000000" crossorigin="anonymous"></script> -->
    
    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --bottom-nav-height: 84px;
            --bottom-nav-buffer: 16px;
            --bottom-nav-total-padding: calc(100px + env(safe-area-inset-bottom, 0px));
        }

        @media (min-width: 768px) {
            :root {
                --bottom-nav-height: 0px;
                --bottom-nav-buffer: 0px;
                --bottom-nav-total-padding: 0px;
            }
        }

        html {
            scroll-behavior: smooth;
            max-width: 100vw;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            max-width: 100vw;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }
        .dark body { background-color: #020617; }

        /* Notch / Safe area utilities */
        .pt-safe {
            padding-top: max(0px, env(safe-area-inset-top, 0px));
        }
        .pb-safe {
            padding-bottom: max(0px, env(safe-area-inset-bottom, 0px));
        }
        .pl-safe {
            padding-left: max(0px, env(safe-area-inset-left, 0px));
        }
        .pr-safe {
            padding-right: max(0px, env(safe-area-inset-right, 0px));
        }
        
        #app-loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            z-index: 10000;
            transition: opacity 0.4s ease-out;
        }
        .dark #app-loader { background: #020617; }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2E5BFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Custom scrollbar for gallery */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
</head>
<body>
    <div id="app-loader">
        <div class="spinner"></div>
    </div>
    
    <div id="root"></div>

    <!-- Core Libraries -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- Advanced Scanning Libraries -->
    <script src="https://cdn.jsdelivr.net/gh/colonelparrot/jscanify@master/src/jscanify.min.js"></script>

    <!-- Main Entry Point -->
    <script type="module" src="index.tsx"></script>

    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('app-loader');
          if (loader) loader.style.opacity = '0';
          setTimeout(() => loader?.remove(), 400);
        }, 500);
      });
    </script>
</body>
</html>
